#
# The development stack. Every project command runs in the `dev` container,
# so Node.js and the dependencies stay off the host (ADR 0008):
#
#   scripts/dev/pnpm.sh install     # any pnpm command, in a one-off dev container
#   scripts/dev/compose.sh up -d    # the stack, with the dev server on http://localhost:3000
#
# Mailpit catches every e-mail the app sends: http://localhost:8025
#
# The credentials are fixed, public and for development only; the ports bind
# the loopback interface only. Never point this file at real data.

name: cdm-plenum-dev

services:
  dev:
    build:
      context: .
      dockerfile: Containerfile.dev
    image: localhost/cdm-plenum-dev:latest
    working_dir: /app
    volumes:
      # :z relabels the checkout for SELinux hosts such as Fedora, shared so several dev containers can use it at once.
      - .:/app:z
      - pnpm-store:/pnpm-store
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://cdm_plenum:cdm_plenum@postgres:5432/cdm_plenum
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: cdm-plenum@example.test
      BETTER_AUTH_SECRET: dev-only-secret-not-for-production-use-0000
      BETTER_AUTH_URL: http://localhost:3000
    command: ["pnpm", "dev"]
    depends_on:
      postgres:
        condition: service_healthy

  # The e2e suite: Playwright with Chromium against the production build, on
  # PostgreSQL and Mailpit of this stack. Run it with scripts/dev/e2e.sh, which
  # builds the image for the Playwright version in package.json.
  e2e:
    image: localhost/cdm-plenum-e2e:${PLAYWRIGHT_VERSION:-unset}
    profiles: ["e2e"]
    working_dir: /app
    volumes:
      - .:/app:z
      - pnpm-store:/pnpm-store
    environment:
      TEST_DATABASE_URL: postgres://cdm_plenum:cdm_plenum@postgres:5432/cdm_plenum
      SMTP_URL: smtp://mailpit:1025
      MAILPIT_URL: http://mailpit:8025
      # Parallel runs share one network namespace, so each needs its own ports.
      E2E_PORT: ${E2E_PORT:-3100}
      E2E_CKM_PORT: ${E2E_CKM_PORT:-3101}
    command: ["pnpm", "test:e2e"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: docker.io/library/postgres:18.7-trixie
    environment:
      POSTGRES_USER: cdm_plenum
      POSTGRES_PASSWORD: cdm_plenum
      POSTGRES_DB: cdm_plenum
    ports:
      - "127.0.0.1:${CDM_PLENUM_DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cdm_plenum -d cdm_plenum"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: docker.io/axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  pnpm-store:
