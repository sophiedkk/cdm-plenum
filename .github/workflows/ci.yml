# CI: typecheck, lint, unit tests with the 70% coverage gate, the
# production build and the e2e suite, run in parallel. `conclusion` needs all
# of them, so branch protection can require that one check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version:` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # The Vitest global setup creates and migrates a run database next to the one
  # TEST_DATABASE_URL names, so the role needs CREATEDB. The image's bootstrap
  # user is a superuser and has it. Image tag and credentials match
  # compose.dev.yaml; the digest pins the tag's multi-arch index, so change both
  # when compose.dev.yaml moves to a new tag.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18.7-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_USER: cdm_plenum
          POSTGRES_PASSWORD: cdm_plenum
          POSTGRES_DB: cdm_plenum
        ports:
          - 5432:5432
        # Over TCP, so the probe stays red while the entrypoint's socket-only
        # initialisation server runs.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cdm_plenum -d cdm_plenum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cdm_plenum:cdm_plenum@localhost:5432/cdm_plenum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Playwright with Chromium against the production build, on its own run
  # database next to TEST_DATABASE_URL and with Mailpit catching the e-mail
  # (playwright.config.ts). PostgreSQL as in `test`; the Mailpit tag matches
  # compose.dev.yaml and the digest pins the tag's multi-arch index.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18.7-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_USER: cdm_plenum
          POSTGRES_PASSWORD: cdm_plenum
          POSTGRES_DB: cdm_plenum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cdm_plenum -d cdm_plenum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: docker.io/axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DATABASE_URL: postgres://cdm_plenum:cdm_plenum@localhost:5432/cdm_plenum
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser of the pinned @playwright/test, with its system libraries.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The one check to require in branch protection. It runs even when a job it
  # needs fails or is cancelled, and fails unless every one succeeded.
  conclusion:
    name: conclusion
    needs: [typecheck, lint, test, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
